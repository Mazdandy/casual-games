<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini Putt — Pixel Arcade</title>
<link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="../../index.html"><span class="brand-mark">◼</span> Pixel<span>Arcade</span></a>
  <nav class="site-nav"><a href="../../index.html">← Kembali</a></nav>
</header>
<main class="container game-wrap">
  <div class="hud">
    <div><span class="label">Skor</span><strong id="score">0</strong></div>
    <div><span class="label">Hole</span><strong id="hole">1/5</strong></div>
    <div><span class="label">Pukulan</span><strong id="stroke">0</strong></div>
    <div><span class="label">Terbaik</span><strong id="best">0</strong></div>
  </div>
  <div class="canvas-frame">
    <canvas id="game" aria-label="Papan permainan Mini Putt"></canvas>
    <div id="overlay" class="overlay">
      <h2>Mini Putt</h2>
      <p>Tarik ke belakang dari bola untuk atur arah &amp; tenaga, lalu lepas untuk memukul.</p>
      <button id="startBtn" class="btn">Mulai</button>
    </div>
  </div>
  <p class="hint">Masukkan bola ke lubang. Par 2 — makin sedikit pukulan, makin besar skornya.</p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
