<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hangman — Pixel Arcade</title>
<link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="../../index.html"><span class="brand-mark">◼</span> Pixel<span>Arcade</span></a>
  <nav class="site-nav"><a href="../../index.html">← Kembali</a></nav>
</header>
<main class="container game-wrap">
  <div class="hud">
    <div><span class="label">Skor</span><strong id="score">0</strong></div>
    <div><span class="label">Terbaik</span><strong id="best">0</strong></div>
    <div><span class="label">Nyawa</span><strong id="lives">6</strong></div>
    <div><span class="label">Kata</span><strong id="wordIdx">1/5</strong></div>
  </div>
  <div class="canvas-frame">
    <canvas id="game" aria-label="Papan permainan Hangman"></canvas>
    <div id="overlay" class="overlay">
      <h2>Hangman</h2>
      <p>Tebak kata huruf per huruf sebelum kesempatan habis. Pakai keyboard di layar atau keyboard asli.</p>
      <button id="startBtn" class="btn">Mulai</button>
    </div>
  </div>
  <p class="hint">Salah tebak 6 kali, tamat. Selesaikan 5 kata buat skor gede!</p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
