<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quick Quiz — Pixel Arcade</title>
<link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="../../index.html"><span class="brand-mark">◼</span> Pixel<span>Arcade</span></a>
  <nav class="site-nav"><a href="../../index.html">← Kembali</a></nav>
</header>
<main class="container game-wrap">
  <div class="hud">
    <div><span class="label">Skor</span><strong id="score">0</strong></div>
    <div><span class="label">Terbaik</span><strong id="best">0</strong></div>
    <div><span class="label">Soal</span><strong id="qnum">1/10</strong></div>
  </div>
  <div class="canvas-frame">
    <canvas id="game" aria-label="Papan permainan Quick Quiz"></canvas>
    <div id="overlay" class="overlay">
      <h2>Quick Quiz</h2>
      <p>Jawab 10 soal pengetahuan umum. Klik jawaban yang kamu pilih di papan.</p>
      <button id="startBtn" class="btn">Mulai</button>
    </div>
  </div>
  <p class="hint">Setiap jawaban benar bernilai 10 poin. Semangat!</p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
