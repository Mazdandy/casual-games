<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pipe Puzzle — Pixel Arcade</title>
<link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="../../index.html"><span class="brand-mark">◼</span> Pixel<span>Arcade</span></a>
  <nav class="site-nav"><a href="../../index.html">← Kembali</a></nav>
</header>
<main class="container game-wrap">
  <div class="hud">
    <div><span class="label">Skor</span><strong id="score">0</strong></div>
    <div><span class="label">Terbaik</span><strong id="best">0</strong></div>
    <div><span class="label">Level</span><strong id="level">1/5</strong></div>
    <div><span class="label">Langkah</span><strong id="langkah">0</strong></div>
  </div>
  <div class="canvas-frame">
    <canvas id="game" aria-label="Papan permainan Pipe Puzzle"></canvas>
    <div id="overlay" class="overlay">
      <h2>Pipe Puzzle</h2>
      <p>Ketuk pipa untuk memutarnya 90°. Sambungkan sumber di kiri ke tujuan di kanan.</p>
      <button id="startBtn" class="btn">Mulai</button>
    </div>
  </div>
  <p class="hint">Selesaikan 5 level. Makin sedikit langkah, makin besar skornya!</p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
