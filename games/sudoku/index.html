<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sudoku — Pixel Arcade</title>
<link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="../../index.html"><span class="brand-mark">◼</span> Pixel<span>Arcade</span></a>
  <nav class="site-nav"><a href="../../index.html">← Kembali</a></nav>
</header>
<main class="container game-wrap">
  <div class="hud">
    <div><span class="label">Skor</span><strong id="score">0</strong></div>
    <div><span class="label">Terbaik</span><strong id="best">0</strong></div>
    <div><span class="label">Waktu</span><strong id="time">0:00</strong></div>
    <div><span class="label">Salah</span><strong id="mistakes">0</strong></div>
  </div>
  <div class="canvas-frame">
    <canvas id="game" aria-label="Papan permainan Sudoku"></canvas>
    <div id="overlay" class="overlay">
      <h2>Sudoku</h2>
      <p>Pilih satu kotak, lalu ketuk angka di bawah atau tekan tombol 1-9 untuk mengisi.</p>
      <button id="startBtn" class="btn">Mulai</button>
    </div>
  </div>
  <p class="hint">Isi kotak agar angka 1-9 unik di setiap baris, kolom, dan kotak 3x3. Angka merah berarti bentrok.</p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
