<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dots and Boxes — Pixel Arcade</title>
<link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="../../index.html"><span class="brand-mark">◼</span> Pixel<span>Arcade</span></a>
  <nav class="site-nav"><a href="../../index.html">← Kembali</a></nav>
</header>
<main class="container game-wrap">
  <div class="hud">
    <div><span class="label">Skor</span><strong id="score">0</strong></div>
    <div><span class="label">Kotak</span><strong id="boxScore">0 : 0</strong></div>
    <div><span class="label">Terbaik</span><strong id="best">0</strong></div>
  </div>
  <div class="canvas-frame">
    <canvas id="game" aria-label="Papan permainan Dots and Boxes"></canvas>
    <div id="overlay" class="overlay">
      <h2>Dots and Boxes</h2>
      <p>Klik garis antar titik untuk menutup kotak. Kotak penuh dapat poin + giliran lagi!</p>
      <button id="startBtn" class="btn">Mulai</button>
    </div>
  </div>
  <p class="hint">Kamu (K) · komputer (M). Tutup kotak terbanyak untuk menang!</p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
