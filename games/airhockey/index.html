<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Air Hockey — Pixel Arcade</title>
<link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="../../index.html"><span class="brand-mark">◼</span> Pixel<span>Arcade</span></a>
  <nav class="site-nav"><a href="../../index.html">← Kembali</a></nav>
</header>
<main class="container game-wrap">
  <div class="hud">
    <div><span class="label">Skor</span><strong id="score">0</strong></div>
    <div><span class="label">Terbaik</span><strong id="best">0</strong></div>
    <div><span class="label">Lawan</span><strong id="rival">0</strong></div>
  </div>
  <div class="canvas-frame">
    <canvas id="game" aria-label="Papan permainan Air Hockey"></canvas>
    <div id="overlay" class="overlay">
      <h2>Air Hockey</h2>
      <p>Gerakkan pemukulmu (setengah bawah) dengan mouse / jari. Panah juga bisa. Pertama ke 7 gol menang!</p>
      <button id="startBtn" class="btn">Mulai</button>
    </div>
  </div>
  <p class="hint">Geser di paruh bawah meja · panah kiri/kanan juga bisa · pertama ke 7 gol menang.</p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
