<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Word Search — Pixel Arcade</title>
<link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="../../index.html"><span class="brand-mark">◼</span> Pixel<span>Arcade</span></a>
  <nav class="site-nav"><a href="../../index.html">← Kembali</a></nav>
</header>
<main class="container game-wrap">
  <div class="hud">
    <div><span class="label">Skor</span><strong id="score">0</strong></div>
    <div><span class="label">Terbaik</span><strong id="best">0</strong></div>
    <div><span class="label">Waktu</span><strong id="time">90</strong></div>
    <div><span class="label">Ditemukan</span><strong id="found">0/6</strong></div>
  </div>
  <div class="canvas-frame">
    <canvas id="game" aria-label="Papan permainan Word Search"></canvas>
    <div id="overlay" class="overlay">
      <h2>Word Search</h2>
      <p>Seret dari sel awal ke sel akhir, atau ketuk sel awal lalu sel akhir, buat memilih kata yang tersembunyi.</p>
      <button id="startBtn" class="btn">Mulai</button>
    </div>
  </div>
  <p class="hint">Kata bisa mendatar, menurun, atau diagonal. Ketemu semua = +50 poin per kata!</p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
