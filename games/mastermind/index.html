<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mastermind — Pixel Arcade</title>
<link rel="stylesheet" href="../../assets/css/styles.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="../../index.html"><span class="brand-mark">◼</span> Pixel<span>Arcade</span></a>
  <nav class="site-nav"><a href="../../index.html">← Kembali</a></nav>
</header>
<main class="container game-wrap">
  <div class="hud">
    <div><span class="label">Skor</span><strong id="score">0</strong></div>
    <div><span class="label">Tebak</span><strong id="guessCount">0/10</strong></div>
    <div><span class="label">Terbaik</span><strong id="best">0</strong></div>
  </div>
  <div class="canvas-frame">
    <canvas id="game" aria-label="Papan permainan Mastermind"></canvas>
    <div id="overlay" class="overlay">
      <h2>Mastermind</h2>
      <p>Susun 4 warna lalu tekan KIRIM. Titik terang = warna &amp; posisi benar, titik redup = warna benar posisi salah.</p>
      <button id="startBtn" class="btn">Mulai</button>
    </div>
  </div>
  <p class="hint">Warna boleh berulang. Pecahkan kode rahasia dalam maksimal 10 tebakan!</p>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
